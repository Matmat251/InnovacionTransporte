spring:
  application:
    name: innovacion-transporte-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/transporte_central}
    username: ${SPRING_DATASOURCE_USERNAME:transporte_app}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${APP_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  corridor: Lima-Huancayo
  company: Expreso Corredor Central S.A.C.
  timezone: ${APP_TIMEZONE:America/Lima}
  currency: ${APP_CURRENCY:PEN}
  delay-threshold-minutes: ${APP_DELAY_THRESHOLD_MINUTES:30}
  risk-service-url: ${RISK_SERVICE_URL:http://localhost:8000}
  open-meteo-base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com/v1/forecast}
  open-meteo-timeout-ms: ${OPEN_METEO_TIMEOUT_MS:3500}
  open-meteo-cache-ttl-minutes: ${OPEN_METEO_CACHE_TTL_MINUTES:30}
  groq-api-key: ${GROQ_API_KEY:}
  groq-base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
  groq-model: ${GROQ_MODEL:openai/gpt-oss-20b}
